[app]
name = "config-demo"
environment = "development"
debug = false

[log]
level = "info"
format = "text"

# A feature-owned section, read by PaymentsConfig.ReadConfig. Override any value
# at runtime with APP_PAYMENTS_<KEY>, e.g. APP_PAYMENTS_CURRENCY=EUR.
[payments]
currency = "USD"
maxRetries = 5
sandbox = true
