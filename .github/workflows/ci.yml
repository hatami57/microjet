name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # New CVEs land against unchanged code, so govulncheck has to run on a timer
  # and not only on pushes. Mondays 06:00 UTC.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  # discover lists every Go module (any directory with a go.mod) so the test
  # matrix tracks the repo automatically — adding or removing a module needs no
  # workflow edit, and examples are covered like any other module.
  discover:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.find.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          modules=$(find . -name go.mod -not -path '*/vendor/*' -exec dirname {} \; \
            | sed 's|^\./||' | sort \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "Discovered modules: $modules"

  # fmt fails the build if any file is not gofmt-clean. staticcheck does not
  # cover formatting, so this is a separate gate.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean; run 'gofmt -w':"
            echo "$unformatted"
            exit 1
          fi

  test:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: "**/go.sum"

      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        working-directory: ${{ matrix.module }}
        run: staticcheck ./...

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -race ./...

  # A framework's CVE exposure is its users' CVE exposure. govulncheck reports
  # only vulnerabilities actually reachable from this module's code, so a
  # finding here is a finding for anyone importing it.
  govulncheck:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: "**/go.sum"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        working-directory: ${{ matrix.module }}
        run: govulncheck ./...

  # golangci-lint reads the repo-root .golangci.yml for every module. The
  # Makefile `lint` target runs the same binary against the same config.
  lint:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: "**/go.sum"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: ${{ matrix.module }}

  # tidy fails the build if any module carries requires it cannot reach from its
  # own import graph (or is missing one it needs). Run per module with the
  # workspace off — go.work would otherwise resolve sibling imports and hide a
  # missing require — then fail if go mod tidy changed anything.
  tidy:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: "**/go.sum"

      - name: go mod tidy (workspace-isolated)
        working-directory: ${{ matrix.module }}
        env:
          GOWORK: "off"
        run: go mod tidy

      - name: Fail if go.mod/go.sum is untidy
        run: |
          if ! git diff --exit-code -- '**/go.mod' '**/go.sum'; then
            echo "::error::${{ matrix.module }} is untidy — run 'cd ${{ matrix.module }} && GOWORK=off go mod tidy' and commit the result" >&2
            exit 1
          fi

  # consumer-build proves the published modules build for an outside consumer
  # that does NOT have the workspace: a throwaway module in a temp dir (so
  # go.work cannot apply), importing host + httpx + gormx + gormx/sqlite, with
  # replace directives pointing at this checkout. If a module under-declares its
  # requires, `go mod tidy` here fails even though the workspace build passes.
  consumer-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: "**/go.sum"

      - name: Build an external consumer without the workspace
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          WORK="$(mktemp -d)"
          cd "$WORK"

          cat > main.go <<'GO'
          // Package main is a throwaway external consumer: it imports and
          // minimally uses the modules an application wires together, so a build
          // here proves those modules resolve without the repo's go.work.
          package main

          import (
          	"github.com/hatami57/microjet/gormx"
          	"github.com/hatami57/microjet/gormx/sqlite"
          	"github.com/hatami57/microjet/host"
          	"github.com/hatami57/microjet/httpx"
          )

          func main() {
          	app := host.MustNew()
          	app.WithModule(gormx.Module(sqlite.Driver())).
          		WithModule(httpx.Module())
          	_ = app
          }
          GO

          # A standalone module with a replace for every published module in the
          # checkout. Modelled on scripts/check-doc-snippets.sh.
          {
            echo "module microjetconsumer"
            echo
            echo "go 1.26.2"
            echo
            while IFS= read -r m; do
              mod=$(awk '/^module /{print $2; exit}' "$ROOT/$m")
              echo "replace $mod => $ROOT/$(dirname "$m")"
            done < <(cd "$ROOT" && find . -name go.mod -not -path './examples/*' -not -path '*/vendor/*' | sed 's|^\./||' | sort)
          } > go.mod

          export GOWORK=off
          go mod tidy
          go build ./...

  # Compiles the ```go blocks in README.md and docs/*.md against this checkout
  # and resolves every microjet symbol they name, so the docs cannot drift from
  # the API (IMPROVEMENTS §1.2).
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: "**/go.sum"

      - name: Check doc snippets
        run: ./scripts/check-doc-snippets.sh
