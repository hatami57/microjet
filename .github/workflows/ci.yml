name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # New CVEs land against unchanged code, so govulncheck has to run on a timer
  # and not only on pushes. Mondays 06:00 UTC.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  # discover lists every Go module (any directory with a go.mod) so the test
  # matrix tracks the repo automatically — adding or removing a module needs no
  # workflow edit, and examples are covered like any other module.
  discover:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.find.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          modules=$(find . -name go.mod -not -path '*/vendor/*' -exec dirname {} \; \
            | sed 's|^\./||' | sort \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "Discovered modules: $modules"

  # fmt fails the build if any file is not gofmt-clean. staticcheck does not
  # cover formatting, so this is a separate gate.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean; run 'gofmt -w':"
            echo "$unformatted"
            exit 1
          fi

  test:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: "**/go.sum"

      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        working-directory: ${{ matrix.module }}
        run: staticcheck ./...

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -race ./...

  # A framework's CVE exposure is its users' CVE exposure. govulncheck reports
  # only vulnerabilities actually reachable from this module's code, so a
  # finding here is a finding for anyone importing it.
  govulncheck:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: "**/go.sum"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        working-directory: ${{ matrix.module }}
        run: govulncheck ./...
