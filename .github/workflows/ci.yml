name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - core
          - types
          - utils
          - aws
          - messaging
          - messaging/nats
          - gormx
          - gormx/migrate
          - gormx/postgres
          - gormx/sqlite
          - httpx
          - host
          - cache
          - jsonx
          - otelx
          - outbox
          - tenant
          - versioninfo
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: "**/go.sum"

      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        working-directory: ${{ matrix.module }}
        run: staticcheck ./...

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -race ./...
